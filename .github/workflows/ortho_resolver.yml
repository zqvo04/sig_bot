name: ORTHO Resolver (채점 5m)

# ORTHO 가상신호 채점기. 5분마다 Notion의 OPEN 가상신호를 OKX 실제 가격으로
# WIN/LOSS/TIMEOUT 판정한다. 신호 생성과 독립. 알림 ON/OFF와 무관하게 항상 동작.

on:
  workflow_dispatch:

concurrency:
  group: ortho-resolver
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve open paper signals
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ORTHO resolver
        env:
          OKX_API_KEY:        ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET:     ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE:     ${{ secrets.OKX_PASSPHRASE }}
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # ORTHO-4 비용 0 가상캠페인 결과 원장. 실체결 비용 모드는 별도 워크플로로 분리한다.
          ORTHO_V4_ENABLED:     "true"
          ORTHO_STRATEGY_ID:    "ORTHO-4.SIM0"
          # Shadow DB도 같은 채점기로 채점(활성 시). 셋 다 있어야 활성.
          NOTION_SHADOW_DB_ID: ${{ secrets.NOTION_SHADOW_DB_ID }}
          ORTHO_SHADOW_LOG:    ${{ vars.ORTHO_SHADOW_LOG }}
          LOG_LEVEL:          ${{ vars.LOG_LEVEL }}
          # ORTHO-4는 BE를 중지하고 CLOSED_CANDLES snapshot의 고정 배리어를 채점한다.
          # T_MAX만 생성기와 공유한다.
          ORTHO_T_MAX:        ${{ vars.ORTHO_T_MAX }}
          ORTHO_RESOLVER_MAX: ${{ vars.ORTHO_RESOLVER_MAX }}
        run: python src/ortho_resolver.py
